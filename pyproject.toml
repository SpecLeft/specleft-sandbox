[project]
name = "specleft-sandbox"
version = "0.1.0"
description = "Notification Rules Engine API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "specleft>=0.2.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
