version: "1.0"

features:
  heading_level: 3
  patterns:
    - "Feature: {title}"
    - "Feature {title}"
    - "{title}"
  contains:
    - "F1 — Rule Management (CRUD)"
    - "F2 — Conditions"
    - "F3 — Channels"
    - "F4 — Event Publishing"
    - "F5 — Dispatch Records"
  match_mode: "contains" # any=pattern OR contains, all=pattern AND contains, patterns=pattern only, contains=contains only
  exclude:
    - "Overview"
    - "Goals"
    - "Project Goals"
    - "API Surface"
    - "Features"
    - "Out of Scope"
    - "Out of Scope (v1)"
    - "Acceptance Scenarios"
    - "Acceptance Scenarios (Gherkin)"
    - "Non-Goals"
    - "Open Questions"
    - "Notes"

scenarios:
  heading_level: [4, 5]
  patterns:
    - "Scenario: {title}"
    - "{title}"
  contains: []
  match_mode: "any" # any=pattern OR contains, all=pattern AND contains, patterns=pattern only, contains=contains only
  step_keywords:
    - "Given"
    - "When"
    - "Then"
    - "And"
    - "But"

priorities:
  patterns:
    - "priority: {value}"
    - "Priority: {value}"
  mapping: {}
